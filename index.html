<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานผลการตรวจเชื้อราและแบคทีเรียในอากาศ</title>
    <!-- เรียกใช้ Bootstrap สำหรับความสวยงามของตาราง -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- เรียกใช้ PapaParse สำหรับดึงและอ่านไฟล์ CSV จาก Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- ฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f6f9;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 600;
        }
        .table th {
            background-color: #004085;
            color: white;
            text-align: center;
            vertical-align: middle;
        }
        .table td {
            text-align: center;
            vertical-align: middle;
        }
        /* กำหนดสีไฮไลท์ตามเกณฑ์ 500 cfu */
        .danger-cell { background-color: #ffcccc !important; color: #990000; font-weight: bold; }
        .safe-cell { background-color: #ccffcc !important; color: #006600; }
        .no-data { background-color: #f8f9fa !important; color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center">รายงานผลการตรวจเชื้อราและแบคทีเรียในอากาศ (ตั้งแต่ปี 2567)</h2>
    <p class="text-center text-muted">เกณฑ์มาตรฐาน: ต้องไม่เกิน 500 cfu/ชนิด</p>
    
    <div id="loading" class="text-center my-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p>กำลังดึงข้อมูลจาก Google Sheets...</p>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover" id="reportTable" style="display: none;">
            <thead id="tableHead">
                <!-- หัวตารางจะถูกสร้างอัตโนมัติจากข้อมูล -->
            </thead>
            <tbody id="tableBody">
                <!-- ข้อมูลจะถูกดึงมาใส่ที่นี่ -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // URL สำหรับดึงข้อมูลจาก Google Sheets เป็นรูปแบบ CSV (ระบุ sheet=ชีต1)
    const sheetId = "1-soxAJSeGzMUt7m-oaELwV24InbvpsTZ0-0nYcMQb1s";
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=ชีต1`;

    // ฟังก์ชันตรวจสอบเงื่อนไขค่า cfu
    function getCellStyles(value) {
        if (!value || value.trim() === '' || value.trim().toLowerCase() === 'nan') {
            return { text: '-', class: 'no-data' };
        }
        
        let textVal = value.trim();
        let lowerText = textVal.toLowerCase();
        
        // กรณีเป็น No Growth ถือว่าปลอดภัย
        if (lowerText === 'no growth') {
            return { text: 'No Growth', class: 'safe-cell' };
        }
        
        // แปลงเป็นตัวเลขเพื่อประเมิน
        let numVal = parseFloat(textVal.replace(/,/g, ''));
        if (!isNaN(numVal)) {
            if (numVal > 500) {
                return { text: numVal.toLocaleString() + ' cfu', class: 'danger-cell' };
            } else {
                return { text: numVal.toLocaleString() + ' cfu', class: 'safe-cell' };
            }
        }
        
        return { text: textVal, class: '' };
    }

    // ใช้ PapaParse อ่านข้อมูลจาก URL
    Papa.parse(csvUrl, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data;
            const headers = results.meta.fields;
            
            if (!data || data.length === 0) {
                document.getElementById('loading').innerHTML = '<p class="text-danger">ไม่พบข้อมูล หรือคุณไม่ได้เปิดสิทธิ์ Share ไฟล์ Google Sheets ให้เป็น "Anyone with the link can view"</p>';
                return;
            }

            // สร้างหัวตาราง (Thead)
            let theadHtml = '<tr>';
            headers.forEach(header => {
                theadHtml += `<th>${header}</th>`;
            });
            theadHtml += '</tr>';
            document.getElementById('tableHead').innerHTML = theadHtml;

            // สร้างข้อมูลตาราง (Tbody)
            let tbodyHtml = '';
            data.forEach(row => {
                // ข้ามแถวที่ว่างเปล่า (แถวที่ไม่มีชื่อจุดตรวจ)
                if(!row[headers[0]]) return;

                tbodyHtml += '<tr>';
                headers.forEach((header, index) => {
                    if (index === 0) {
                        // คอลัมน์แรกคือ "จุดตรวจ" ไม่ต้องใส่เงื่อนไขสี
                        tbodyHtml += `<td><strong>${row[header]}</strong></td>`;
                    } else {
                        // ตรวจสอบค่าผลการตรวจและลงสี
                        let cellStyle = getCellStyles(row[header]);
                        tbodyHtml += `<td class="${cellStyle.class}">${cellStyle.text}</td>`;
                    }
                });
                tbodyHtml += '</tr>';
            });
            document.getElementById('tableBody').innerHTML = tbodyHtml;

            // ปิด Loading และโชว์ตาราง
            document.getElementById('loading').style.display = 'none';
            document.getElementById('reportTable').style.display = 'table';
        },
        error: function(error) {
            document.getElementById('loading').innerHTML = `<p class="text-danger">เกิดข้อผิดพลาดในการดึงข้อมูล: ${error.message}</p>`;
        }
    });
</script>

</body>
</html>
