<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102d3a">
<title>ระบบเฝ้าระวังคุณภาพอากาศภายในโรงพยาบาล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
 --navy:#12313d;--navy2:#1c4652;--teal:#087e82;--teal-soft:#e7f5f3;
 --ink:#1d3038;--muted:#71818a;--line:#e5ecee;--bg:#f3f7f8;--white:#fff;
 --green:#16845b;--green-bg:#eaf6ef;--red:#c44747;--red-bg:#fff0ef;
 --amber:#a96d16;--amber-bg:#fff6e7;--shadow:0 8px 26px rgba(20,52,63,.055);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',sans-serif;font-size:15px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{background:linear-gradient(112deg,var(--navy),#1c4d58);color:white;padding:25px max(24px,calc((100vw - 1440px)/2));}
.topline{display:flex;align-items:center;justify-content:space-between;gap:18px;max-width:1440px;margin:auto}
.brand{display:flex;align-items:center;gap:14px}
.brandmark{width:48px;height:48px;border:1px solid rgba(255,255,255,.25);border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:25px}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#b8d5d9;font-weight:700}
h1{font-size:clamp(20px,2.5vw,29px);line-height:1.25;margin:3px 0 5px;font-weight:700}
.subtitle{color:#c7dadd;font-size:13px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-pill{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);border-radius:30px;padding:8px 13px;font-size:12px;color:#e6f1f2}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#75dfad;margin-right:7px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;transition:.18s}
.btn-light{background:#fff;color:var(--navy)}
.btn-light:hover{background:#eaf4f5}
.btn-workspace{background:#fff;color:#4b5563;border:1px solid #e5ecee;display:inline-flex;align-items:center;gap:6px;}
.btn-workspace:hover{background:#f9fafb;}
.btn-ghost{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.container{max-width:1440px;margin:0 auto;padding:25px 24px 48px}
.notice{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;padding:13px 16px;margin-bottom:19px;box-shadow:var(--shadow)}
.notice-icon{font-size:19px}
.notice strong{display:block;font-size:13px;margin-bottom:2px}
.notice p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:18px 0}
.section-title{font-size:16px;font-weight:700;color:var(--navy)}
.section-sub{font-size:12px;color:var(--muted);margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.control{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;color:var(--ink);min-width:145px;outline:none}
.control:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(8,126,130,.1)}
.search{min-width:210px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:17px}
.kpi{background:white;border:1px solid var(--line);border-radius:14px;padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;width:72px;height:72px;border-radius:50%;right:-23px;top:-25px;background:var(--tint,#e9f4f4)}
.kpi-label{font-size:12px;color:var(--muted);font-weight:600;position:relative;z-index:1}
.kpi-value{font-size:31px;line-height:1.2;font-weight:800;color:var(--navy);margin:7px 0 3px;position:relative;z-index:1}
.kpi-foot{font-size:11px;color:var(--muted);position:relative;z-index:1}
.kpi.teal{--tint:#e6f4f3}.kpi.green{--tint:#e7f5ed}.kpi.red{--tint:#fff0ee}.kpi.amber{--tint:#fff5e5}
.kpi.green .kpi-value{color:var(--green)}.kpi.red .kpi-value{color:var(--red)}.kpi.amber .kpi-value{color:var(--amber)}
.grid-main{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px}
.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-title{font-size:14px;font-weight:700;color:var(--navy)}
.panel-desc{font-size:11px;color:var(--muted);margin-top:2px}
.panel-body{padding:17px 18px}
.chart-wrap{height:265px;position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:8px;height:8px;border-radius:50%;display:inline-block}
.alert-list{display:flex;flex-direction:column;gap:9px;max-height:265px;overflow:auto}
.alert-item{border:1px solid #f4d9d7;background:#fffafa;border-radius:10px;padding:11px 12px}
.alert-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.alert-place{font-size:13px;font-weight:700;color:var(--ink)}
.tag{font-size:10px;font-weight:700;border-radius:20px;padding:3px 8px;white-space:nowrap}
.tag-danger{color:var(--red);background:var(--red-bg)}
.tag-safe{color:var(--green);background:var(--green-bg)}
.alert-values{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--muted)}
.alert-values b{color:var(--red)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}
.table-panel{margin-top:16px}
.table-tools{display:flex;gap:8px;align-items:center}
.table-wrap{overflow:auto;max-height:590px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;white-space:nowrap}
th{position:sticky;top:0;background:#f7fafb;color:#63757d;font-size:11px;font-weight:700;z-index:2}
th,td{padding:12px 13px;border-bottom:1px solid #edf1f2;text-align:center}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:3;background:white;min-width:210px}
th:first-child{background:#f7fafb;z-index:4}
tbody tr:hover td{background:#f8fbfb; cursor:pointer}
tbody tr:hover td:first-child{background:#f8fbfb}
.place-name{font-weight:700;color:var(--navy)}
.cell{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:5px 8px;font-weight:700;font-size:10px}
.cell.safe{background:var(--green-bg);color:var(--green)}
.cell.danger{background:var(--red-bg);color:var(--red)}
.cell.none{color:#a3afb4;background:#f4f6f7}
.small-muted{font-size:10px;color:var(--muted);font-weight:400}
.loading,.error{padding:50px 20px;text-align:center;color:var(--muted)}
.spinner{width:26px;height:26px;border:3px solid #e4eeee;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#8a999f;font-size:11px;padding:17px 2px}
.hidden{display:none!important}
@media(max-width:950px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.topbar{padding:19px 16px}.topline{align-items:flex-start;flex-direction:column}.container{padding:17px 13px 32px}.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%}.control,.search{min-width:0;flex:1;width:100%}.kpis{gap:9px}.kpi{padding:13px}.kpi-value{font-size:25px}.panel-head,.panel-body{padding:13px}.table-tools{width:100%}.table-tools .btn{flex:1}}

/* Modal Styles */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
}
.modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
}
.modal-content {
    background: white;
    border-radius: 14px;
    width: 90%;
    max-width: 800px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    position: relative;
    transform: translateY(20px);
    transition: transform 0.2s;
}
.modal-overlay.active .modal-content {
    transform: translateY(0);
}
.modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: none; border: none;
    font-size: 24px; color: var(--muted);
    cursor: pointer;
}
.modal-title {
    font-size: 18px; font-weight: 700; color: var(--navy);
    margin-bottom: 4px;
}
.modal-subtitle {
    font-size: 13px; color: var(--muted);
    margin-bottom: 20px;
}
.modal-chart-wrap {
    height: 350px;
    position: relative;
    width: 100%;
}

/* เพิ่มเติม: สไตล์สำหรับกล่องข้อเสนอแนะและฟอร์มกรอกข้อมูล */
.suggestion-box {
    margin-top: 10px;
    padding: 10px 12px;
    background: #fdfaf4;
    border-left: 3px solid #d29a42;
    border-radius: 6px;
    font-size: 11.5px;
    color: var(--navy);
    line-height: 1.5;
}
.entry-grid-wrap {
    max-height: 60vh;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-top: 15px;
}
.entry-table {
    width: 100%;
    border-collapse: collapse;
}
.entry-table th {
    background: #f4f7f8;
    position: sticky;
    top: 0;
    z-index: 5;
    font-size: 12px;
}
.entry-table td {
    padding: 8px;
    border-bottom: 1px solid #edf1f2;
}
.entry-input {
    width: 80px;
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 4px;
    text-align: center;
}
.entry-input:focus {
    border-color: var(--teal);
    outline: none;
}
.period-select-wrap {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    align-items: center;
}
.period-select-wrap select, .period-select-wrap input {
    padding: 8px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
}
.btn-primary {
    background: var(--teal);
    color: white;
}
.btn-primary:hover {
    background: #066a6d;
}
.btn-primary:disabled {
    background: #a3c4c5;
    cursor: not-allowed;
}
.form-info {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="topline">
  <div class="brand">
   <div class="brandmark">✚</div>
   <div>
    <div class="eyebrow">Hospital Environmental Surveillance</div>
    <h1>รายงานเฝ้าระวังคุณภาพอากาศภายในโรงพยาบาล</h1>
    <div class="subtitle">ผลการตรวจวิเคราะห์แบคทีเรียและเชื้อราในอากาศ · Indoor Air Quality</div>
   </div>
  </div>
  <div class="top-actions">
   <span class="status-pill"><i class="status-dot"></i><span id="connectionText">กำลังเชื่อมต่อข้อมูล</span></span>
   <button class="btn btn-primary" id="openEntryBtn">📝 บันทึกผลรอบใหม่</button>
   <button class="btn btn-ghost" id="refreshBtn">↻ รีเฟรช</button>
   <button class="btn btn-light" id="exportBtn">↓ ส่งออก CSV</button>
   <button class="btn btn-workspace" onclick="window.location.href='https://praetinee.github.io/JanWorkspace/'">
